  <text x="64" y="1048" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#3d4a5c" letter-spacing="2">SIGNAL → DISTIL → TASTE.md → PROMPT · v0.3.0 · regex / hybrid</text>
