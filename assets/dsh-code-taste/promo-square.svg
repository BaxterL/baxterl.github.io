  <text x="64" y="404" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Microsoft YaHei',monospace" font-size="30" fill="#93a3b8">让鲸鱼持续学习你的代码品味、审美风格和各种习惯</text>

