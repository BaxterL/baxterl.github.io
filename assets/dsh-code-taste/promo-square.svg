<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t d">
  <title id="t">dsh-code-taste · 1:1 promo</title>
  <desc id="d">Square promo card for the dsh-code-taste DeepSeek Harness plugin.</desc>
  <defs>
