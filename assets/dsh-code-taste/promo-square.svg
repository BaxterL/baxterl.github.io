    <rect x="296" y="868" width="180" height="52" rx="10" fill="#0e1620" stroke="#22303f"/>
    <text x="320" y="902" fill="#cfe6ff">可手改</text>
    <rect x="492" y="868" width="244" height="52" rx="10" fill="#0e1620" stroke="#22303f"/>
